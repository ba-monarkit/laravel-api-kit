# Production stack: docker compose -f docker-compose.prod.yml up -d --build
#
# Reads configuration from .env on the server (see "Deployment" in README.md).
# Code is baked into the image; no source bind mounts, no Mailpit, Telescope off.

x-app: &app
  build:
    context: .
    target: prod
  image: laravel-api-kit:prod
  env_file: ${ENV_FILE:-.env}
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    DB_HOST: mysql
    REDIS_HOST: redis
    TELESCOPE_ENABLED: ${TELESCOPE_ENABLED:-false}
  volumes:
    # Persists logs and the Passport keys generated on first boot
    - storage:/var/www/storage
  restart: unless-stopped

services:
  app:
    <<: *app
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: mysql
      REDIS_HOST: redis
      TELESCOPE_ENABLED: ${TELESCOPE_ENABLED:-false}
      RUN_MIGRATIONS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "migrate:status", "--no-ansi"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10", "--max-time=3600"]
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  nginx:
    build:
      context: .
      target: nginx
    image: laravel-api-kit:nginx
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  storage:
  mysql-data:
  redis-data:
